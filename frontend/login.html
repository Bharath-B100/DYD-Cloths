<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DYD-Clothes</title>
    <link rel="icon" type="image/png" href="images/LOGO_DYD.png">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="nav-container">
            <!-- Logo -->
            <a href="index.html" class="logo">
                <img src="images/LOGO_DYD.png" class="logo-icon" style="height:40px; width:auto; border-radius:4px; object-fit:contain;">
                <span class="site-name">D<span style="color: var(--primary)">Y</span>D-Clothes</span><br><small class="site-tagline" style="font-size: 0.6em; opacity: 0.7; display: block; margin-top: -5px;">Design your Dream Clothes</small>
            </a>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Navigation Links -->
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="studio.html">Design Studio</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                
                <!-- Auth Links (shown on mobile) -->
                <div class="auth-buttons mobile-auth">
                    <a href="login.html" class="auth-link">Sign In</a>
                </div>
            </ul>

            <!-- Desktop Auth & Cart -->
            <div class="nav-right">
                <div class="auth-buttons desktop-auth">
                    <a href="login.html" class="auth-link">Sign In</a>
                </div>
                
                <!-- Cart Icon -->
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Login to your account</p>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm" action="" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <div class="auth-divider" style="text-align:center; margin: 16px 0; color: var(--text-muted); position: relative;">
                <span style="background: var(--bg-card, #121212); padding: 0 10px; z-index: 1; position: relative;">or</span>
                <hr style="position: absolute; top: 50%; left: 0; right: 0; border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 0;">
            </div>

            <button id="googleAuthBtn" type="button" class="btn btn-outline btn-full" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                <img src="https://www.gstatic.com/images/branding/product/1x/gcheck_24dp.png" alt="Google" style="height: 18px; width: 18px;">
                Continue with Google
            </button>

            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/core/firebase-auth.js"></script>
    <script src="assets/js/core/auth.js?v=20260723-google-rebuild"></script>
    <script src="assets/js/core/cart.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
