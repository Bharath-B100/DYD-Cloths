<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - DYD-Cloths</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .track-container {
            max-width: 900px;
            margin: 140px auto 80px;
            padding: 2rem;
        }
        
        .track-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .track-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .track-form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .track-input-group {
            display: flex;
            gap: 1rem;
        }
        
        .track-input-group input {
            flex: 1;
        }
        
        .order-status-tracker {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .status-steps {
            display: flex;
            justify-content: space-between;
            margin: 2rem 0;
            position: relative;
        }
        
        .status-steps::before {
            content: '';
            position: absolute;
            top: 24px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border-color);
            z-index: 1;
        }
        
        .status-step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }
        
        .step-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            transition: all 0.3s;
        }
        
        .status-step.completed .step-icon {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        
        .status-step.active .step-icon {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: scale(1.1);
        }
        
        .step-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .status-step.completed .step-label,
        .status-step.active .step-label {
            color: var(--text-primary);
        }
        
        .order-info-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: var(--text-muted);
        }
        
        .info-value {
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .tracking-number {
            font-family: monospace;
            background: var(--bg-primary);
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
        }
        
        @media (max-width: 640px) {
            .track-container {
                padding: 1rem;
            }
            
            .track-input-group {
                flex-direction: column;
            }
            
            .status-steps {
                flex-direction: column;
                gap: 1rem;
            }
            
            .status-steps::before {
                display: none;
            }
            
            .status-step {
                display: flex;
                align-items: center;
                gap: 1rem;
                text-align: left;
            }
            
            .step-icon {
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-tshirt logo-icon"></i>
                <span>DYD-Cloths</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="studio.html">Design Studio</a></li>
                <li><a href="track-order.html" class="active">Track Order</a></li>
            </ul>
            <div class="nav-right">
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="track-container">
        <div class="track-header">
            <h1>Track Your Order</h1>
            <p>Enter your order number to check delivery status</p>
        </div>
        
        <div class="track-form">
            <div class="track-input-group">
                <input type="text" id="orderNumber" class="form-control" placeholder="Enter Order Number (e.g., ORD-20240101-1234)">
                <button id="trackBtn" class="btn btn-primary">Track Order</button>
            </div>
            <div id="trackError" class="error-message" style="display: none; margin-top: 1rem;"></div>
        </div>
        
        <div id="orderDetails" style="display: none;">
            <!-- Order details will be loaded here -->
        </div>
    </div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/core/auth.js"></script>
    <script src="assets/js/core/cart.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        const statusSteps = [
            { key: 'pending', label: 'Order Placed', icon: 'fa-shopping-cart' },
            { key: 'confirmed', label: 'Confirmed', icon: 'fa-check-circle' },
            { key: 'processing', label: 'Processing', icon: 'fa-cogs' },
            { key: 'shipped', label: 'Shipped', icon: 'fa-truck' },
            { key: 'delivered', label: 'Delivered', icon: 'fa-home' }
        ];
        
        function getStatusIndex(status) {
            const index = statusSteps.findIndex(s => s.key === status);
            return index === -1 ? 0 : index;
        }
        
        function renderStatusTracker(currentStatus) {
            const currentIndex = getStatusIndex(currentStatus);
            
            return `
                <div class="status-steps">
                    ${statusSteps.map((step, index) => `
                        <div class="status-step ${index < currentIndex ? 'completed' : index === currentIndex ? 'active' : ''}">
                            <div class="step-icon">
                                <i class="fas ${step.icon}"></i>
                            </div>
                            <div class="step-label">${step.label}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        async function trackOrder() {
            const orderNumber = document.getElementById('orderNumber').value.trim();
            const errorDiv = document.getElementById('trackError');
            const detailsDiv = document.getElementById('orderDetails');
            
            if (!orderNumber) {
                errorDiv.textContent = 'Please enter an order number';
                errorDiv.style.display = 'block';
                return;
            }
            
            errorDiv.style.display = 'none';
            detailsDiv.style.display = 'none';
            detailsDiv.innerHTML = '<div class="admin-loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            
            try {
                const res = await API.get(`/orders/track?orderNumber=${encodeURIComponent(orderNumber)}`);
                
                if (res.success && res.data && res.data.length > 0) {
                    const order = res.data[0];
                    
                    detailsDiv.innerHTML = `
                        <div class="order-status-tracker">
                            <h3>Order Status</h3>
                            ${renderStatusTracker(order.status)}
                            
                            <div class="order-info-card">
                                <div class="info-row">
                                    <span class="info-label">Order Number</span>
                                    <span class="info-value tracking-number">${order.orderNumber}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Order Date</span>
                                    <span class="info-value">${Utils.formatDate(order.createdAt)}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Total Amount</span>
                                    <span class="info-value">${Utils.formatINR(order.totalAmount)}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Status</span>
                                    <span class="info-value status-badge status-${order.status}">${order.status.toUpperCase()}</span>
                                </div>
                                ${order.trackingNumber ? `
                                <div class="info-row">
                                    <span class="info-label">Tracking Number</span>
                                    <span class="info-value tracking-number">${order.trackingNumber}</span>
                                </div>
                                ` : ''}
                                ${order.estimatedDelivery ? `
                                <div class="info-row">
                                    <span class="info-label">Estimated Delivery</span>
                                    <span class="info-value">${Utils.formatDate(order.estimatedDelivery)}</span>
                                </div>
                                ` : ''}
                            </div>
                            
                            <div class="order-info-card">
                                <h4>Items Ordered</h4>
                                ${order.items ? order.items.map(item => `
                                    <div class="info-row">
                                        <span>${item.name} (${item.quantity}x)</span>
                                        <span>${Utils.formatINR(item.price * item.quantity)}</span>
                                    </div>
                                `).join('') : ''}
                            </div>
                            
                            <div class="order-info-card">
                                <h4>Need Help?</h4>
                                <p>If you have any questions about your order, please contact our support team at <strong>ngtbharath@gmail.com</strong></p>
                            </div>
                        </div>
                    `;
                    detailsDiv.style.display = 'block';
                } else {
                    errorDiv.textContent = 'Order not found. Please check your order number and try again.';
                    errorDiv.style.display = 'block';
                    detailsDiv.style.display = 'none';
                }
            } catch (error) {
                console.error('Track order error:', error);
                errorDiv.textContent = 'Failed to track order. Please try again later.';
                errorDiv.style.display = 'block';
                detailsDiv.style.display = 'none';
            }
        }
        
        document.getElementById('trackBtn').addEventListener('click', trackOrder);
        document.getElementById('orderNumber').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') trackOrder();
        });
        
        // Check URL for order number parameter
        const urlParams = new URLSearchParams(window.location.search);
        const orderParam = urlParams.get('order');
        if (orderParam) {
            document.getElementById('orderNumber').value = orderParam;
            trackOrder();
        }
    </script>
</body>
</html>
