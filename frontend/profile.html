<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - DYD-Cloths</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="profile-page">
    <nav class="navbar">
        <div class="nav-container">
            <!-- Logo -->
            <a href="index.html" class="logo">
                <i class="fas fa-tshirt logo-icon"></i>
                <span>DYD-Cloths</span><br><small style="font-size: 0.6em; opacity: 0.7; display: block; margin-top: -5px;">Design your Dream Cloths</small>
            </a>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Navigation Links -->
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="studio.html">Design Studio</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                
                <!-- Auth Links (shown on mobile) -->
                <div class="auth-buttons mobile-auth">
                    <a href="login.html" class="auth-link">Sign In</a>
                </div>
            </ul>

            <!-- Desktop Auth & Cart -->
            <div class="nav-right">
                <div class="auth-buttons desktop-auth">
                    <a href="login.html" class="auth-link">Sign In</a>
                </div>
                
                <!-- Cart Icon -->
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <header class="profile-header">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div class="profile-info">
                <h1 id="profileName">User Name</h1>
                <p id="profileEmail">user@example.com</p>
            </div>
        </header>

        <div class="profile-tabs">
            <button class="tab-btn active" data-tab="orders">My Orders</button>
            <button class="tab-btn" data-tab="wishlist">Wishlist</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
            <button class="tab-btn" id="logoutBtn">Logout</button>
        </div>

        <div id="ordersTab" class="tab-content active">
            <div id="ordersList">
                <div class="admin-loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading your orders...</p>
                </div>
            </div>
        </div>

        <div id="wishlistTab" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>My Wishlist</h3>
                <button class="btn btn-outline" id="shareWishlistBtn"><i class="fas fa-share-alt"></i> Share</button>
            </div>
            <div id="wishlistList" class="products-grid">
                <div class="admin-loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading your wishlist...</p>
                </div>
            </div>
        </div>

        <div id="settingsTab" class="tab-content">
            <div class="order-card">
                <h3>Account Settings</h3>
                <form id="settingsForm" style="margin-top: 20px;">
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="settingsName" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="settingsEmail" class="form-control" disabled>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/core/auth.js"></script>
    <script src="assets/js/core/cart.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/profile.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
