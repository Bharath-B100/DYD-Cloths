<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - DYD-Cloths</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .confirmation-container {
            max-width: 800px;
            margin: 140px auto 80px;
            padding: 2rem;
            text-align: center;
        }
        
        .confirmation-icon {
            width: 100px;
            height: 100px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 2rem;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .order-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
            text-align: left;
        }
        
        .order-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 1rem;
        }
        
        .order-info-item {
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        
        .order-info-item label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0.25rem;
        }
        
        .order-info-item span {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .items-list {
            margin-top: 1rem;
        }
        
        .confirmation-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .confirmation-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-name {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
        
        @media (max-width: 640px) {
            .order-info-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-tshirt logo-icon"></i>
                <span>DYD-Cloths</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="studio.html">Design Studio</a></li>
            </ul>
            <div class="nav-right">
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="confirmation-container">
        <div class="confirmation-icon">
            <i class="fas fa-check"></i>
        </div>
        
        <h1>Order Confirmed!</h1>
        <p>Thank you for your purchase. Your order has been received.</p>
        
        <div class="order-card" id="orderDetails">
            <div class="admin-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading order details...</p>
            </div>
        </div>
        
        <div class="button-group">
            <a href="shop.html" class="btn btn-primary">
                <i class="fas fa-shopping-bag"></i> Continue Shopping
            </a>
            <a href="profile.html#ordersTab" class="btn btn-outline">
                <i class="fas fa-list"></i> View My Orders
            </a>
        </div>
    </div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('id');
            
            if (!orderId) {
                document.getElementById('orderDetails').innerHTML = `
                    <div class="error-state">
                        <p>Order not found. Please check your email for confirmation.</p>
                    </div>
                `;
                return;
            }
            
            try {
                const res = await API.get(`/orders/${orderId}`);
                
                if (res.success) {
                    const order = res.data;
                    
                    document.getElementById('orderDetails').innerHTML = `
                        <h3>Order #${order.orderNumber || order._id?.slice(-8)}</h3>
                        <div class="order-info-grid">
                            <div class="order-info-item">
                                <label>Order Date</label>
                                <span>${Utils.formatDate(order.createdAt)}</span>
                            </div>
                            <div class="order-info-item">
                                <label>Total Amount</label>
                                <span>${Utils.formatINR(order.totalAmount)}</span>
                            </div>
                            <div class="order-info-item">
                                <label>Payment Method</label>
                                <span>${order.paymentMethod?.replace('_', ' ').toUpperCase() || 'N/A'}</span>
                            </div>
                            <div class="order-info-item">
                                <label>Order Status</label>
                                <span class="status-badge status-${order.status}">${order.status}</span>
                            </div>
                        </div>
                        
                        <h4 style="margin-top: 1.5rem;">Items Ordered</h4>
                        <div class="items-list">
                            ${order.items.map(item => `
                                <div class="confirmation-item">
                                    <img src="${item.image}" alt="${item.name}">
                                    <div class="item-details">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-meta">Size: ${item.size} | Color: ${item.color} | Qty: ${item.quantity}</div>
                                    </div>
                                    <div class="item-price">${Utils.formatINR(item.price * item.quantity)}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <h4 style="margin-top: 1.5rem;">Shipping Address</h4>
                        <p>${order.shippingAddress.street}<br>
                        ${order.shippingAddress.city}, ${order.shippingAddress.state} ${order.shippingAddress.zipCode}<br>
                        ${order.shippingAddress.country}</p>
                        
                        <div class="order-info-item" style="margin-top: 1rem;">
                            <label>Customer Email</label>
                            <span>${order.customer.email}</span>
                        </div>
                    `;
                } else {
                    throw new Error('Order not found');
                }
            } catch (error) {
                console.error('Error loading order:', error);
                document.getElementById('orderDetails').innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Failed to load order details. Please check your email for confirmation.</p>
                    </div>
                `;
            }
        });
    </script>
    
    <script src="assets/js/core/cart.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
